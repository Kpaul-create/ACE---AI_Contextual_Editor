services:
  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: ace
    ports:
      - "5432:5432"
    volumes:
      - ace-db:/var/lib/postgresql/data
      - ./src/db/schema.sql:/docker-entrypoint-initdb.d/01_schema.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d ace"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build: .
    env_file:
      - .env
    environment:
      SUPABASE_URL: http://db:5432
    ports:
      - "8080:8080"
    depends_on:
      db:
        condition: service_healthy

volumes:
  ace-db:
